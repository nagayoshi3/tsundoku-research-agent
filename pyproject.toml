[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsundoku-research-agent"
version = "0.1.0"
description = "Tsundoku (積ん読) research agent: Inoreader の「後で読む」に溜めた記事を週次でまとめ・採点・要約し、人の承認を経てレポートにする LangGraph エージェント"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nagayoshi Yamashita" }]
keywords = ["tsundoku", "langgraph", "rss", "inoreader", "research", "llm", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain==1.4.3",
  "langchain-openai==1.7.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "requests>=2.31",
  "feedparser>=6.0",
  "trafilatura>=1.9",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tsundoku = "tsundoku.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsundoku = ["default_config.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
